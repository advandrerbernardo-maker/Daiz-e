/* ---- extração dos dados (nada é inventado: só o que o OCR leu e passou nas validações) ---- */
/* Os nomes de documentos devem estar associados à etiqueta NOME.
   Nunca preencher um nome a partir do cabeçalho mais longo do documento. */
const STL=/\b(REP[UÚ]BLICA|FEDERATIV|BRASIL|CARTEIRA|NACIONAL|HABILITA|IDENTIDADE|MINIST|SECRETARIA|DETRAN|DOCUMENTO|ASSINATURA|V[AÁ]LID|TERRIT|FILIA|REGISTRO|NASCIMENTO|NATURALIDADE|EXPEDI|CATEGORIA|OBSERVA|INSTITUTO|POL[IÍ]CIA|PERMISS|MOTORISTA|ENDERE|VENCIMENTO|ENERGIA|FATURA|CONSUMIDOR)/i;

const limpaNome=s=>s.replace(/[^A-Za-zÀ-ÿ'’\s-]/g,' ').replace(/\s+/g,' ').trim();

function acharNome(L){

  if(/^\W*(?:\d+\s*[.)-]?\s*)?nome\s+d[ao]\s+(?:pai|m[aã]e)\b/i.test(L[i]))continue;

  if(nomeOk(cand))return titulo(cand);

  for(let j=i+1;j<Math.min(i+3,L.length);j++){
   if(/^\W*(?:cpf|rg|cnh|filia[cç][aã]o|data|nascimento|endere[cç]o|validade|m[aã]e|pai)\b/i.test(L[j]))break;

// A leitura do OCR pode gerar sequências sem sentido parecidas com "R. 123".

const excluirAssinatura=()=>{if(!confirm('Remover assinatura deste celular?'))return;localStorage.removeItem(TEST_PREFIX+CHAVE_ASSINATURA);setAssinaturaLocal('');setStatusAssinatura('Assinatura removida.')};
const go=s=>{setErr('');setScr(s)};
const novoRecibo=()=>{setEditId(null);setD(blank());setRes(null);setPm('');setPh('');go('new')};
const editarRecibo=r=>{setEditId(r.id);setCur(r);setD({...r});setRes(null);setPm('');setPh('');go('new')};
const cancelarFormulario=()=>{if(editId){setEditId(null);setD(blank());go('done')}else{setD(blank());go('home')}};
const excluirRecibo=r=>{
 if(!window.confirm('Excluir o recibo nº '+r.numero+' de '+r.nome+'? Ele será movido para a lixeira e poderá ser restaurado.'))return;
 setUltimoNumero(n=>Math.max(n,nRec(r)));
 setLixeira(prev=>[{...r,excluidoEm:new Date().toISOString()},...prev.filter(x=>x.id!==r.id)]);
 setRecs(prev=>prev.filter(x=>x.id!==r.id));setCur(null);setEditId(null);setMostrarLixeira(false);go('hist');
};
const restaurarRecibo=r=>{
 if(recs.some(x=>x.id===r.id)){setErr('Este recibo já está no histórico.');return}
 const {excluidoEm,...recuperado}=r;setRecs(prev=>[recuperado,...prev]);setLixeira(prev=>prev.filter(x=>x.id!==r.id));setMostrarLixeira(false);go('hist')
};
const onPhoto=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
setRes(null);setPm('');setPh('busy');
try{
 if(!navigator.onLine){setPm(AVISO_OCR_ONLINE);setPh('offline');return}
 const q=await analisar(f);
 if(q.problema){setPm(q.problema);setPh('bad');return}
 setPh('reading');
 const w=await getWorker(),r=await limite(w.recognize(q.canvas),120000,'A leitura demorou demais. Tente de novo com uma foto mais próxima do documento.');
 const txt=r.data.text||'',conf=r.data.confidence||0,pal=txt.split(/\s+/).filter(t=>t.replace(/\W/g,'').length>2).length;
 if(conf<35||pal<8){setPm('Não consegui ler o texto do documento (legibilidade baixa). Tire outra foto, mais perto, com boa luz e sem reflexo.');setPh('bad');return}
 const x=extrair(txt);
 if(!x.nome&&!x.cpf&&!x.end){
  setPm('O texto foi lido, mas não foi possível identificar nome, CPF ou endereço com segurança. Tire outra foto mais próxima, sem reflexos, ou preencha manualmente.');
  setPh('bad');return;
 }
 // Cada nova fotografia substitui os dados reconhecidos anteriormente.
 // Nunca misture o CPF de um documento com o nome de outro.
 setD(p=>({...p,clienteId:'',nome:x.nome||'',cpf:x.cpf||'',end:x.end||''}));
 setRes(x);setPh(x.nome&&x.cpf?'read':'partial');
}catch(x){setPm(!navigator.onLine?AVISO_OCR_ONLINE:'Não foi possível reconhecer o documento. Verifique a conexão, tire outra foto ou digite os dados manualmente. Detalhe: '+String(x&&x.message||x));setPh('fail')}};
// Não reutilizar número após exclusão. A maior numeração fica salva separadamente do histórico.
const maiorNumero=Math.max(ultimoNumero,...recs.map(nRec),...lixeira.map(nRec));
const numero=editId?(recs.find(r=>r.id===editId)?.numero||String(maiorNumero+1).padStart(4,'0')):String(maiorNumero+1).padStart(4,'0');
const setF=k=>e=>setD({...d,[k]:e.target.value});
const pick=e=>{const c=clients.find(x=>x.id===e.target.value);setD(c?{...d,clienteId:c.id,nome:c.nome,cpf:c.cpf,end:c.end}:{...d,clienteId:''})};
const saveC=()=>{if(!cf.nome.trim()){setErr('Informe o nome do cliente.');return}setClients(cf.id?clients.map(c=>c.id===cf.id?cf:c):[...clients,{...cf,id:'c'+Date.now()}]);go('clients')};
const review=()=>{if(!d.nome.trim())return setErr('Informe o nome do cliente.');if(d.cpf&&!cpfOk(d.cpf))return setErr('CPF inválido. Confira os números.');if(!d.valor)return setErr('Informe o valor.');if(!d.ref.trim())return setErr('Preencha o campo “Referente a”.');go('review')};
const confirm=()=>{
 if(editId){
  const anterior=recs.find(r=>r.id===editId);
  if(!anterior){setErr('Não encontrei o recibo original. Volte ao histórico.');go('hist');return}
  const campos=['clienteId','nome','cpf','end','valor','ref','forma','data'];
  const mudou=campos.some(k=>String(anterior[k]??'')!==String(d[k]??''));
  if(!mudou){setCur(anterior);setEditId(null);setD(blank());go('done');return}
  const agora=new Date().toISOString();
  const registro={em:agora,anterior:Object.fromEntries(campos.map(k=>[k,anterior[k]]))};
  const atualizado={...anterior,...Object.fromEntries(campos.map(k=>[k,d[k]])),revisadoEm:agora,revisoes:[...(anterior.revisoes||[]),registro]};
  setRecs(prev=>prev.map(r=>r.id===editId?atualizado:r));
  setCur(atualizado);setEditId(null);setD(blank());go('done');return;
 }
 const r={...d,id:'r'+Date.now(),numero,em:{...EMI}};
 setUltimoNumero(n=>Math.max(n,nRec(r)));setRecs(prev=>[r,...prev]);setCur(r);setD(blank());go('done')
};

if(scr==='done'&&cur)return html`<${Done} r=${cur} go=${go} onEdit=${editarRecibo} onDelete=${excluirRecibo}/>`;
if(scr==='emp')return html`<${Top} t="Dados da imobiliária" back=${()=>go('home')}/><main><div class="card f" style="gap:12px"><div class="f"><label>Nome da imobiliária</label><input value=${ef.nome} onInput=${e=>setEf({...ef,nome:e.target.value})}/></div><div class="f"><label>Razão social</label><input value=${ef.rs||''} onInput=${e=>setEf({...ef,rs:e.target.value})}/></div><div class="f"><label>CNPJ</label><input inputMode="numeric" placeholder="00.000.000/0000-00" value=${ef.cnpj} onInput=${e=>setEf({...ef,cnpj:cnpjMask(e.target.value)})}/></div><div class="f"><label>Endereço e telefone (opcional)</label><input value=${ef.end} onInput=${e=>setEf({...ef,end:e.target.value})}/></div><div class="f"><label>Assinatura nos recibos</label><div class="mut">Escolha a foto da assinatura azul. O fundo da foto será removido. A imagem ficará somente neste celular e aparecerá sobre a linha azul do PDF e das imagens.</div><input type="file" accept="image/*" onChange=${subirAssinatura}/>${statusAssinatura&&html`<div class="mut" role="status">${statusAssinatura}</div>`}${assinaturaLocal&&html`<div style="background:white;border-radius:10px;padding:12px;text-align:center"><img src=${assinaturaLocal} alt="Assinatura salva" style="height:65px;max-width:90%;object-fit:contain"/></div><button type="button" class="btn alt" onClick=${excluirAssinatura}>Remover assinatura</button>`}</div><div class="mut">Esses dados saem em todos os recibos novos.</div>${err&&html`<div class="err" role="alert">${err}</div>`}</div><button class="btn" onClick=${()=>{if(!ef.nome.trim())return setErr('Informe o nome da imobiliária.');EMI=ef;ls.set('dz-e',ef);setEm(ef);go('home')}}>Salvar dados</button></main>`;
if(scr==='hist'){
 const L=(mostrarLixeira?lixeira:recs).filter(r=>(String(r.nome||'')+String(r.ref||'')+String(r.numero||'')).toLowerCase().includes(q.toLowerCase()));
 return html`<${Top} t=${mostrarLixeira?'Lixeira de recibos':'Histórico'} back=${()=>{if(mostrarLixeira){setMostrarLixeira(false);setQ('')}else go('home')}}/><main>
 <input placeholder="Buscar por nome, número ou assunto" value=${q} onInput=${e=>setQ(e.target.value)}/>
 <div class="card">${L.length?L.map(r=>html`<div class="rec-item" key=${r.id}>
 ${mostrarLixeira?html`<div class="li" style="cursor:default"><span>Nº ${r.numero} · ${r.nome}<small>${dbr(r.data)} · ${r.ref}</small></span><b>${brl(r.valor)}</b></div>`:html`<button class="li" onClick=${()=>{setCur(r);go('done')}}><span>Nº ${r.numero} · ${r.nome}<small>${dbr(r.data)} · ${r.ref}${r.revisadoEm?' · retificado':''}</small></span><b>${brl(r.valor)}</b></button>`}
 <div class="rec-actions">${mostrarLixeira?html`<button onClick=${()=>restaurarRecibo(r)}>Restaurar recibo</button>`:html`<button onClick=${()=>editarRecibo(r)}>✎ Editar</button><button class="danger" onClick=${()=>excluirRecibo(r)}>Excluir</button>`}</div></div>`):html`<div class="empty">${mostrarLixeira?'A lixeira está vazia.':'Nenhum recibo encontrado.'}</div>`}</div>
 ${err&&html`<div class="err" role="alert">${err}</div>`}
 <button class="btn alt" onClick=${()=>{setMostrarLixeira(!mostrarLixeira);setQ('');setErr('')}}>${mostrarLixeira?'← Voltar ao histórico':'Lixeira ('+lixeira.length+')'}</button>
 </main>`
}
if(scr==='clients')return html`<${Top} t="Clientes" back=${()=>go('home')}/><main>
<button class="btn" onClick=${()=>{setCf({nome:'',cpf:'',tel:'',end:''});go('client')}}>+ Novo cliente</button>
<div class="card">${clients.length?clients.map(c=>html`<button class="li" onClick=${()=>{setCf(c);go('client')}}><span>${c.nome}<small>${c.cpf||'Sem CPF'}</small></span><span class="mut">Editar</span></button>`):html`<div class="empty">Nenhum cliente ainda. Cadastre o primeiro para preencher recibos mais rápido.</div>`}</div></main>`;
if(scr==='client'&&cf)return html`<${Top} t=${cf.id?'Editar cliente':'Novo cliente'} back=${()=>go('clients')}/><main><div class="card f" style="gap:12px">
<div class="f"><label>Nome completo</label><input value=${cf.nome} onInput=${e=>setCf({...cf,nome:e.target.value})}/></div>
<div class="f"><label>CPF</label><input inputMode="numeric" placeholder="000.000.000-00" value=${cf.cpf} onInput=${e=>setCf({...cf,cpf:cpfMask(e.target.value)})}/></div>
<div class="f"><label>Telefone</label><input inputMode="tel" value=${cf.tel} onInput=${e=>setCf({...cf,tel:e.target.value})}/></div>
<div class="f"><label>Endereço</label><input value=${cf.end} onInput=${e=>setCf({...cf,end:e.target.value})}/></div>
${err&&html`<div class="err" role="alert">${err}</div>`}</div>
<button class="btn" onClick=${saveC}>Salvar cliente</button>
${cf.id&&html`<button class="btn alt" onClick=${()=>{setClients(clients.filter(c=>c.id!==cf.id));go('clients')}}>Excluir cliente</button>`}</main>`;
if(scr==='new')return html`<${Top} t=${(editId?'Editar recibo · Nº ':'Novo recibo · Nº ')+numero} back=${cancelarFormulario}/><main><div class="card f" style="gap:12px">
<div class="f"><div class="row"><label class="btn" style="margin:0">📷 Abrir câmera<input type="file" accept="image/*" capture="environment" hidden onChange=${onPhoto}/></label><label class="btn alt" style="margin:0">🖼️ Anexar imagem<input type="file" accept="image/*" hidden onChange=${onPhoto}/></label></div>${ph==='busy'&&html`<div class="mut">Analisando nitidez, resolução e iluminação…</div>`}${ph==='reading'&&html`<div class="mut">Lendo o documento no aparelho… pode levar até 30 segundos.</div>`}${(ph==='bad'||ph==='fail'||ph==='offline')&&html`<div class="err" role="alert">${pm}</div>`}${(ph==='read'||ph==='partial')&&res&&html`<div class=${ph==='read'?'ok':'err'}><b>${ph==='read'?'Leitura com nome e CPF identificados. Confirme os dados antes de emitir.':'Leitura parcial: confira os dados identificados e preencha manualmente os campos ausentes. Não utilize informações duvidosas.'}</b><br/>Nome: ${res.nome?'lido':'não encontrado'} · CPF: ${res.cpf?'lido e válido':(res.inval?'lido, mas inválido: digite o CPF':'não encontrado')} · Endereço: ${res.end?'lido':'não encontrado neste documento'}</div>`}</div>
<div class="f"><label>Cliente cadastrado</label><select value=${d.clienteId} onChange=${pick}><option value="">Digitar manualmente</option>${clients.map(c=>html`<option value=${c.id}>${c.nome}</option>`)}</select></div>
<div class="f"><label>Nome</label><input value=${d.nome} onInput=${setF('nome')}/></div>
<div class="row"><div class="f"><label>CPF</label><input inputMode="numeric" value=${d.cpf} onInput=${e=>setD({...d,cpf:cpfMask(e.target.value)})}/></div><div class="f"><label>Data</label><input type="date" value=${d.data} onInput=${setF('data')}/></div></div>
<div class="f"><label>Endereço</label><input value=${d.end} onInput=${setF('end')}/></div>
<div class="f"><label>Valor</label><input inputMode="numeric" placeholder="R$ 0,00" value=${d.valor?brl(d.valor):''} onInput=${e=>setD({...d,valor:Number(e.target.value.replace(/\D/g,'')||0)})}/></div>
<div class="f"><label>Referente a</label><input value=${d.ref} onInput=${setF('ref')} placeholder="Ex.: aluguel de outubro/2026"/></div>
<div class="chips">${['Aluguel','Caução','Taxa de administração','Condomínio'].map(t=>html`<button class="chip" onClick=${()=>setD({...d,ref:t})}>${t}</button>`)}</div>
<div class="chips">${tp.map(t=>html`<button class="chip" onClick=${()=>setD({...d,ref:t.ref,forma:t.forma,valor:t.valor})}>★ ${t.ref}</button>`)}<button class="chip" onClick=${()=>d.ref.trim()?setTp([...tp.filter(t=>t.ref!==d.ref),{ref:d.ref,forma:d.forma,valor:d.valor}]):setErr('Preencha “Referente a” para salvar o modelo.')}>Salvar como modelo</button></div>
<div class="f"><label>Forma de pagamento</label><select value=${d.forma} onChange=${setF('forma')}>${['PIX','Dinheiro','Transferência','Cartão','Boleto'].map(f=>html`<option>${f}</option>`)}</select></div>
${err&&html`<div class="err" role="alert">${err}</div>`}</div>
<button class="btn" onClick=${review}>${editId?'Revisar alterações':'Revisar recibo'}</button>
${editId&&html`<button class="btn alt" onClick=${cancelarFormulario}>Cancelar edição</button>`}</main>`;
if(scr==='review')return html`<${Top} t=${editId?'Conferir correção':'Conferir recibo'} back=${()=>go('new')}/><main>${!EMI.cnpj&&html`<div class="err" role="alert">O CNPJ da imobiliária não está cadastrado e não vai aparecer no recibo. Cadastre na tela inicial.</div>`}
${editId&&html`<div class="ok"><b>Correção do recibo nº ${numero}</b><br/>O número não será alterado. Ao salvar, a versão atualizada substituirá a anterior no histórico do Daiz-e e ficará identificada como retificada. Se já enviou o recibo, compartilhe a versão corrigida com o destinatário.</div>`}
<${Paper} r=${{...d,numero}}/><button class="btn" onClick=${confirm}>${editId?'Salvar alterações':'Confirmar emissão'}</button><button class="btn alt" onClick=${()=>go('new')}>Voltar aos dados</button></main>`;
return html`<${Top} t="Daiz-e"/><main>
<div class="card hero"><h2>Recibos em segundos</h2><p>${EMI.nome}</p><button class="btn light" onClick=${novoRecibo}>Emitir novo recibo</button></div>
<div class="row"><button class="btn alt" onClick=${()=>go('clients')}>Clientes (${clients.length})</button><button class="btn alt" onClick=${()=>go('hist')}>Histórico (${recs.length})</button></div>
<button class="btn alt" onClick=${()=>{setEf(EMI);go('emp')}}>${EMI.cnpj?'Dados da imobiliária':'Cadastrar CNPJ da imobiliária'}</button>
<div class="mut" style="text-align:center">Leitura automática com internet. Recibos manuais disponíveis offline.</div>
<div class="card"><h3>Últimos recibos</h3>${recs.length?recs.slice(0,6).map(r=>html`<button class="li" onClick=${()=>{setCur(r);go('done')}}><span>Nº ${r.numero} · ${r.nome}<small>${dbr(r.data)} · ${r.ref}</small></span><b>${brl(r.valor)}</b></button>`):html`<div class="empty">Nenhum recibo emitido. Toque em “Emitir novo recibo” para começar.</div>`}</div></main>`}
class EB extends React.Component{constructor(p){super(p);this.state={e:null}}static getDerivedStateFromError(e){return{e}}render(){const e=this.state.e;return e?React.createElement('pre',{style:{padding:12,color:'#b3261e',whiteSpace:'pre-wrap'}},'Erro: '+e.message+'\n'+String(e.stack||'').slice(0,700)):this.props.children}}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(EB,null,React.createElement(App)));
</script>

</body>
