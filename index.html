*{box-sizing:border-box}html,body{margin:0}

@media screen{.print{display:none}}
@media print{body *{visibility:hidden}.print,.print *{visibility:visible}.print{position:absolute;left:0;top:0;width:100%}}
</style>

const onPhoto=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;setPh('busy');
try{const bl=await blur(f).catch(()=>99);
const s=window.claude&&await window.claude.use('sample');if(!s){setPh('nosample');return}
setPh('reading');const b=await shrink(f);
const o=await s.json('Extraia os dados deste documento brasileiro (RG, CNH, CPF ou comprovante de endereço). Responda SOMENTE com JSON no formato {"nome":"","cpf":"","end":""}. Use "" para o que não estiver legível. A foto pode estar inclinada, escura ou com reflexo: leia com o máximo de esforço. Não invente dados.',{images:[b],cache:false,modelTier:'default'});
const n=String(o.nome||'').trim(),c=cpfMask(String(o.cpf||'')),a=String(o.end||'').trim();
if(!n&&!c&&!a){setPh(bl<30?'bad':'empty');return}
setD(p=>({...p,clienteId:'',nome:n||p.nome,cpf:c||p.cpf,end:a||p.end}));setPh('read')}
catch(x){setPh(x&&x.code==='not_granted'?'denied':'fail')}};
const numero=String(recs.length+1).padStart(4,'0');
const setF=k=>e=>setD({...d,[k]:e.target.value});
const pick=e=>{const c=clients.find(x=>x.id===e.target.value);setD(c?{...d,clienteId:c.id,nome:c.nome,cpf:c.cpf,end:c.end}:{...d,clienteId:''})};
const saveC=()=>{if(!cf.nome.trim()){setErr('Informe o nome do cliente.');return}setClients(cf.id?clients.map(c=>c.id===cf.id?cf:c):[...clients,{...cf,id:'c'+Date.now()}]);go('clients')};
const review=()=>{if(!d.nome.trim())return setErr('Informe o nome do cliente.');if(d.cpf&&!cpfOk(d.cpf))return setErr('CPF inválido. Confira os números.');if(!d.valor)return setErr('Informe o valor.');if(!d.ref.trim())return setErr('Preencha o campo “Referente a”.');go('review')};
const confirm=()=>{const r={...d,id:'r'+Date.now(),numero,em:EMI};setRecs([r,...recs]);setCur(r);setD(blank());go('done')};

if(scr==='done'&&cur)return html`<${Done} r=${cur} go=${go}/>`;
if(scr==='emp')return html`<${Top} t="Dados da imobiliária" back=${()=>go('home')}/><main><div class="card f" style="gap:12px"><div class="f"><label>Nome da imobiliária</label><input value=${ef.nome} onInput=${e=>setEf({...ef,nome:e.target.value})}/></div><div class="f"><label>Razão social</label><input value=${ef.rs||''} onInput=${e=>setEf({...ef,rs:e.target.value})}/></div><div class="f"><label>CNPJ</label><input inputMode="numeric" placeholder="00.000.000/0000-00" value=${ef.cnpj} onInput=${e=>setEf({...ef,cnpj:cnpjMask(e.target.value)})}/></div><div class="f"><label>Endereço e telefone (opcional)</label><input value=${ef.end} onInput=${e=>setEf({...ef,end:e.target.value})}/></div><div class="mut">Esses dados saem em todos os recibos novos.</div>${err&&html`<div class="err" role="alert">${err}</div>`}</div><button class="btn" onClick=${()=>{if(!ef.nome.trim())return setErr('Informe o nome da imobiliária.');EMI=ef;ls.set('dz-e',ef);setEm(ef);go('home')}}>Salvar dados</button></main>`;
if(scr==='hist'){const L=recs.filter(r=>(r.nome+r.ref+r.numero).toLowerCase().includes(q.toLowerCase()));return html`<${Top} t="Histórico" back=${()=>go('home')}/><main><input placeholder="Buscar por nome, número ou assunto" value=${q} onInput=${e=>setQ(e.target.value)}/><div class="card">${L.length?L.map(r=>html`<button class="li" onClick=${()=>{setCur(r);go('done')}}><span>Nº ${r.numero} · ${r.nome}<small>${dbr(r.data)} · ${r.ref}</small></span><b>${brl(r.valor)}</b></button>`):html`<div class="empty">Nenhum recibo encontrado.</div>`}</div></main>`}
if(scr==='clients')return html`<${Top} t="Clientes" back=${()=>go('home')}/><main>
<button class="btn" onClick=${()=>{setCf({nome:'',cpf:'',tel:'',end:''});go('client')}}>+ Novo cliente</button>
<div class="card">${clients.length?clients.map(c=>html`<button class="li" onClick=${()=>{setCf(c);go('client')}}><span>${c.nome}<small>${c.cpf||'Sem CPF'}</small></span><span class="mut">Editar</span></button>`):html`<div class="empty">Nenhum cliente ainda. Cadastre o primeiro para preencher recibos mais rápido.</div>`}</div></main>`;
if(scr==='client'&&cf)return html`<${Top} t=${cf.id?'Editar cliente':'Novo cliente'} back=${()=>go('clients')}/><main><div class="card f" style="gap:12px">
<div class="f"><label>Nome completo</label><input value=${cf.nome} onInput=${e=>setCf({...cf,nome:e.target.value})}/></div>
<div class="f"><label>CPF</label><input inputMode="numeric" placeholder="000.000.000-00" value=${cf.cpf} onInput=${e=>setCf({...cf,cpf:cpfMask(e.target.value)})}/></div>
<div class="f"><label>Telefone</label><input inputMode="tel" value=${cf.tel} onInput=${e=>setCf({...cf,tel:e.target.value})}/></div>
<div class="f"><label>Endereço</label><input value=${cf.end} onInput=${e=>setCf({...cf,end:e.target.value})}/></div>
${err&&html`<div class="err" role="alert">${err}</div>`}</div>
<button class="btn" onClick=${saveC}>Salvar cliente</button>
${cf.id&&html`<button class="btn alt" onClick=${()=>{setClients(clients.filter(c=>c.id!==cf.id));go('clients')}}>Excluir cliente</button>`}</main>`;
if(scr==='new')return html`<${Top} t=${'Novo recibo · Nº '+numero} back=${()=>go('home')}/><main><div class="card f" style="gap:12px">
<div class="f"><div class="row"><label class="btn" style="margin:0">📷 Abrir câmera<input type="file" accept="image/*" capture="environment" hidden onChange=${onPhoto}/></label><label class="btn alt" style="margin:0">🖼️ Anexar imagem<input type="file" accept="image/*" hidden onChange=${onPhoto}/></label></div>${ph==='busy'&&html`<div class="mut">Analisando foto…</div>`}${ph==='bad'&&html`<div class="err" role="alert">Não consegui ler: a foto parece desfocada ou escura. Tire outra com boa luz, sem reflexo e com o celular firme.</div>`}${ph==='reading'&&html`<div class="mut">Lendo os dados do documento…</div>`}${ph==='read'&&html`<div class="ok">Dados lidos da foto e preenchidos abaixo. Confira nome, CPF e endereço antes de emitir.</div>`}${ph==='empty'&&html`<div class="err" role="alert">Não consegui ler dados nessa foto. Tente outra mais nítida ou preencha manualmente.</div>`}${ph==='nosample'&&html`<div class="err" role="alert">A leitura automática não está disponível nesta visualização. Preencha manualmente.</div>`}${ph==='denied'&&html`<div class="err" role="alert">Permissão negada para ler a foto. Preencha manualmente.</div>`}${ph==='fail'&&html`<div class="err" role="alert">Não foi possível ler a foto agora. Tente novamente ou preencha manualmente.</div>`}</div>
<div class="f"><label>Cliente cadastrado</label><select value=${d.clienteId} onChange=${pick}><option value="">Digitar manualmente</option>${clients.map(c=>html`<option value=${c.id}>${c.nome}</option>`)}</select></div>
<div class="f"><label>Nome</label><input value=${d.nome} onInput=${setF('nome')}/></div>
<div class="row"><div class="f"><label>CPF</label><input inputMode="numeric" value=${d.cpf} onInput=${e=>setD({...d,cpf:cpfMask(e.target.value)})}/></div><div class="f"><label>Data</label><input type="date" value=${d.data} onInput=${setF('data')}/></div></div>
<div class="f"><label>Endereço</label><input value=${d.end} onInput=${setF('end')}/></div>
<div class="f"><label>Valor</label><input inputMode="numeric" placeholder="R$ 0,00" value=${d.valor?brl(d.valor):''} onInput=${e=>setD({...d,valor:Number(e.target.value.replace(/\D/g,'')||0)})}/></div>
<div class="f"><label>Referente a</label><input value=${d.ref} onInput=${setF('ref')} placeholder="Ex.: aluguel de outubro/2026"/></div>
<div class="chips">${['Aluguel','Caução','Taxa de administração','Condomínio'].map(t=>html`<button class="chip" onClick=${()=>setD({...d,ref:t})}>${t}</button>`)}</div>
<div class="chips">${tp.map(t=>html`<button class="chip" onClick=${()=>setD({...d,ref:t.ref,forma:t.forma,valor:t.valor})}>★ ${t.ref}</button>`)}<button class="chip" onClick=${()=>d.ref.trim()?setTp([...tp.filter(t=>t.ref!==d.ref),{ref:d.ref,forma:d.forma,valor:d.valor}]):setErr('Preencha “Referente a” para salvar o modelo.')}>Salvar como modelo</button></div>
<div class="f"><label>Forma de pagamento</label><select value=${d.forma} onChange=${setF('forma')}>${['PIX','Dinheiro','Transferência','Cartão','Boleto'].map(f=>html`<option>${f}</option>`)}</select></div>
${err&&html`<div class="err" role="alert">${err}</div>`}</div>
<button class="btn" onClick=${review}>Revisar recibo</button></main>`;
if(scr==='review')return html`<${Top} t="Conferir recibo" back=${()=>go('new')}/><main>${!EMI.cnpj&&html`<div class="err" role="alert">O CNPJ da imobiliária não está cadastrado e não vai aparecer no recibo. Cadastre na tela inicial.</div>`}<${Paper} r=${{...d,numero}}/><button class="btn" onClick=${confirm}>Confirmar emissão</button><button class="btn alt" onClick=${()=>go('new')}>Editar dados</button></main>`;
return html`<${Top} t="Daiz-e"/><main>
<div class="card hero"><h2>Recibos em segundos</h2><p>${EMI.nome}</p><button class="btn light" onClick=${()=>go('new')}>Emitir novo recibo</button></div>
<div class="row"><button class="btn alt" onClick=${()=>go('clients')}>Clientes (${clients.length})</button><button class="btn alt" onClick=${()=>go('hist')}>Histórico (${recs.length})</button></div>
<button class="btn alt" onClick=${()=>{setEf(EMI);go('emp')}}>${EMI.cnpj?'Dados da imobiliária':'Cadastrar CNPJ da imobiliária'}</button>
<div class="card"><h3>Últimos recibos</h3>${recs.length?recs.slice(0,6).map(r=>html`<button class="li" onClick=${()=>{setCur(r);go('done')}}><span>Nº ${r.numero} · ${r.nome}<small>${dbr(r.data)} · ${r.ref}</small></span><b>${brl(r.valor)}</b></button>`):html`<div class="empty">Nenhum recibo emitido. Toque em “Emitir novo recibo” para começar.</div>`}</div></main>`}
class EB extends React.Component{constructor(p){super(p);this.state={e:null}}static getDerivedStateFromError(e){return{e}}render(){const e=this.state.e;return e?React.createElement('pre',{style:{padding:12,color:'#b3261e',whiteSpace:'pre-wrap'}},'Erro: '+e.message+'\n'+String(e.stack||'').slice(0,700)):this.props.children}}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(EB,null,React.createElement(App)));
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})</script>
</body>
</html>
